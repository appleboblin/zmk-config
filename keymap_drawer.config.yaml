# keymap-drawer config, used by .github/workflows/draw.yml
parse_config:
  trans_legend: { t: "", type: trans }
  layer_legend_map:
    Function: "2xFn"
  # module paths as fetched by `west update` from config/west.yml
  zmk_additional_includes:
    - zmk-helpers/include
    - zmk-auto-layer/dts

  # labels for custom behaviors
  raw_binding_map:
    "&smart_shft": { t: "Shift", s: "CapsWord" }
    "&shift2 RSHFT RSHFT": "Shift"
    "&gui_fn": { t: "Gui", s: "2xFn" }
    "&num_dance": "NumWord"
    "&f_copy": "Copy"
    "&f_paste": "Paste"
    "&f_cut": "Cut"
    "&f_all": "Sel All"
    "&f_back": "Undo"
    "&lplt": "( <"
    "&rpgt": ") >"
    "&quote": "' _"
    "&comma": ", ?"
    "&hyphen": '- "'
    "&slash": "/ <"
    "&to GRAPHITE": "→ Graphite"
    "&to QWERT": "→ QWERTY"
    "&sys_reset": "Reset"
    "&bootloader": "Boot"

  # combos are active on Graphite/QWERTY/NumRow; only draw them on Graphite.
  # keys are combo_<name> (zmk-helpers node names); extra fields set placement.
  zmk_combos:
    combo_nmpd: { l: [Graphite], k: "Numpad tog", a: top, o: 1.7, w: 46, h: 34 }
    combo_lbrc: &g { l: [Graphite] }
    combo_lpar: *g
    combo_cut: { <<: *g, a: bottom, o: 0.9 }
    combo_copy: { <<: *g, w: 34 }
    combo_paste: { <<: *g, w: 36 }
    combo_all: { <<: *g, a: bottom, o: 1.6 }
    combo_lspace: { <<: *g, w: 40 }
    combo_lenter: { <<: *g, a: top, o: 0.9, w: 40 }
    combo_excl: *g
    combo_at: *g
    combo_hash: *g
    combo_dllr: *g
    combo_prcnt: *g
    combo_bsh: *g
    combo_equ: *g
    combo_plus: *g
    combo_pipe: *g
    combo_grv: *g
    combo_rbrc: *g
    combo_rpgr: *g
    combo_bspc: { <<: *g, a: bottom, o: 0.9, w: 38 }
    combo_del: { <<: *g, a: bottom, o: 1.6 }
    combo_renter: { <<: *g, a: top, o: 0.9, w: 40 }
    combo_cbspc: { <<: *g, a: bottom, o: 2.4, w: 38, h: 32 }
    combo_under: *g
    combo_semi: *g
    combo_colon: *g
    combo_tilde: *g
    combo_dqt: *g
    combo_caret: *g
    combo_amps: *g
    combo_astrk: *g

draw_config:
  dark_mode: auto
  shrink_wide_legends: 6
  svg_extra_style: |
    text.layer-activator { text-decoration: none; }
